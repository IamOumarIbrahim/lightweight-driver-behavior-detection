# Upstream-compatible D-FINE-N configuration for the DMS-Eval Low-Light Extension.
# Ratio files override only the training annotation and output paths.
__include__:
  - ../../../third_party/D-FINE/configs/runtime.yml
  - ../../../third_party/D-FINE/configs/dfine/include/dataloader.yml
  - ../../../third_party/D-FINE/configs/dfine/include/optimizer.yml
  - ../../../third_party/D-FINE/configs/dfine/include/dfine_hgnetv2.yml

task: detection
model: DFINE
criterion: DFINECriterion
postprocessor: DFINEPostProcessor
evaluator:
  type: CocoEvaluator
  iou_types: [bbox]

num_classes: 2
remap_mscoco_category: false
eval_spatial_size: [640, 640]

HGNetv2:
  name: B0
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: false
  use_lab: true
  pretrained: true

HybridEncoder:
  in_channels: [512, 1024]
  feat_strides: [16, 32]
  hidden_dim: 128
  use_encoder_idx: [1]
  dim_feedforward: 512
  expansion: 0.34
  depth_mult: 0.5

DFINETransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  dim_feedforward: 512
  num_levels: 2
  num_layers: 3
  eval_idx: -1
  num_points: [6, 6]

train_dataloader:
  type: DataLoader
  total_batch_size: 8
  shuffle: true
  num_workers: 4
  drop_last: false
  dataset:
    type: CocoDetection
    img_folder: data/processed/NIR/images
    ann_file: data/processed/NIR/coco/dfine/ratio_1to6/instances_train.json
    return_masks: false
    transforms:
      type: Compose
      policy:
        epoch: 148
  collate_fn:
    stop_epoch: 148
    ema_restart_decay: 0.9999
    base_size: 640
    base_size_repeat: null

val_dataloader:
  type: DataLoader
  total_batch_size: 8
  shuffle: false
  num_workers: 4
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  dataset:
    type: CocoDetection
    img_folder: data/processed/NIR/images
    ann_file: data/processed/NIR/coco/dfine/evaluation/instances_val.json
    return_masks: false
    transforms:
      type: Compose

epochs: 220
gradient_accumulation_steps: 4
use_amp: true
use_ema: true
checkpoint_freq: 100
output_dir: runs/NIR/dfine_n/ratio_1to6/training
summary_dir: runs/NIR/dfine_n/ratio_1to6/training/summary
seed: 13
sync_bn: false
find_unused_parameters: false

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    - params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.0
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001
